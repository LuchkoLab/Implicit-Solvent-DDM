# Helper file to handle all configs

[coverage:run]
# .coveragerc to control coverage.py and pytest-cov
omit =
    # Omit the tests
    */tests/*
    # Omit generated versioneer
    implicit_solvent_ddm/_version.py

[yapf]
# YAPF, in .style.yapf files this shows up as "[style]" header
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

[flake8]
# Flake8, PyFlakes, etc
max-line-length = 119

[versioneer]
# Automatic version numbering scheme
VCS = git
style = pep440
versionfile_source = implicit_solvent_ddm/_version.py
versionfile_build = implicit_solvent_ddm/_version.py
tag_prefix = ''

[aliases]
test = pytest

[tool:pytest]
testpaths = implicit_solvent_ddm/tests
addopts = --strict-markers -m "not workflow"
markers =
    workflow: full Toil + sander CB7 run via session fixture run_workflow (~2 min)
    hpc: needs MPI AMBER, a GPU or MCL-1 data; never runs on GitHub CI
