name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'scripts/**', '**/*.md', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'scripts/**', '**/*.md', '.github/workflows/docs.yml']
  schedule:
    - cron: '30 7 * * 1'          # weekly run on main: catches conda-forge drift
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash -el {0}            # login shell activates the micromamba env
# CPU only: GitHub runners have no GPU; GPU/MPI tests carry the hpc marker and are deselected.
# Both jobs run in parallel on every PR.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.conda-lock.yml   # exact packages, no solve
          environment-name: isddm_env
          cache-environment: true
          cache-downloads: true
      - run: python -m pip install -e .          # brings toil==8.2.0
      - run: >-
          pytest implicit_solvent_ddm/tests -m "not workflow and not hpc"
          --durations=15 --cov=implicit_solvent_ddm --cov-report=xml
      - uses: codecov/codecov-action@v5
        continue-on-error: true
        with: { files: ./coverage.xml, flags: unittests, token: '${{ secrets.CODECOV_TOKEN }}' }
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.conda-lock.yml   # exact packages, no solve
          environment-name: isddm_env
          cache-environment: true
          cache-downloads: true
      - run: python -m pip install -e .
      - run: pytest implicit_solvent_ddm/tests -m "workflow and not hpc" --durations=10
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: workflow-logs, path: mdgb/, if-no-files-found: ignore }
