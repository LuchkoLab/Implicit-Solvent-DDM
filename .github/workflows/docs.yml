name: Docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'implicit_solvent_ddm/**.py', 'README.md', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'README.md', '.github/workflows/docs.yml']
  workflow_dispatch:
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults:
      run:
        shell: bash -el {0}   # login shell activates the micromamba env
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with: { environment-file: devtools/conda-envs/test_env.conda-lock.yml, environment-name: isddm_env, cache-environment: true }
      - run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - run: make -C docs clean html
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with: { github_token: '${{ secrets.GITHUB_TOKEN }}', publish_dir: ./docs/_build/html }
