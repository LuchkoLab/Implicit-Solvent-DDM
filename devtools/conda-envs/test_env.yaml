name: isddm_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ambertools=24.8      # sander/cpptraj/tleap/pytraj; nompi: no sander.MPI, no pmemd
  - pymbar-core=4.2.0    # pymbar 4 API without the jax extra; block_mbar uses its solver internals
  - alchemlyb=2.4.1
  - numpy<2
  - pandas>=2.1,<3
  - parmed
  - scipy
  - matplotlib-base
  - pytables             # to_hdf
  - pyarrow              # to_parquet
  - pyyaml
  - setuptools<70
  - pip
  - pytest
  - pytest-cov
