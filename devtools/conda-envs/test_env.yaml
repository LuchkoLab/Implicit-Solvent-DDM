name: isddm_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ambertools=24.8      # sander/cpptraj/tleap/pytraj; nompi: no sander.MPI, no pmemd
  - parmed=4.3.1
  - pymbar=4.2.0         # block_mbar needs the pymbar-4 API
  - alchemlyb=2.4.1
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - matplotlib-base=3.10
  - pytables=3.10        # to_hdf
  - pyarrow=22           # to_parquet
  - pyyaml
  - setuptools<70
  - pip
  - pytest
  - pytest-cov
