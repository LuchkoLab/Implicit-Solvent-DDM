
workflow_jobs:
  plot_overlap_matrix: true
  adaptive_lambda: True 

hardware_parameters:
  executable: "pmemd" # executable machine for MD choice : [sander, sander.MPI, pmemed, pemed.MPI, pmeded.CUDA]
  mpi_command:  # system dependent /
  CUDA:  # run on GPU
  memory: "2G"
  disk: "3G"
  output_directory_name: mdgb

endstate_parameter_files:
  complex_parameter_filename: metro_inputs/cb7_adn_ligand_1_Hmass.parm7 # list of topology file of a complex
  complex_coordinate_filename: metro_inputs/cb7_adn_ligand_1_Hmass_298K.nc # list of coordinate file of a complex
  ligand_parameter_filename: metro_inputs/adn_ligand.parm7
  ligand_coordinate_filename: metro_inputs/adn_ligand_1_Hmass_298K.nc
  receptor_parameter_filename: metro_inputs/receptor_adn.parm7
  receptor_coordinate_filename: metro_inputs/receptor_rep3_298K.nc
  ignore_unique_naming: True

number_of_cores_per_system:
  complex_ncores: 1 #total number of cores per job
  ligand_ncores: 1 #total number of cores per ligand simulation
  receptor_ncores: 1 #total number of cores per ligand simulation

AMBER_masks:
  receptor_mask: ':CB7' # list of Amber masks denoting receptor atoms in respected complex file
  ligand_mask: ':ADN' # list of Amber masks denoting ligand atoms in respected complex file


workflow:
  endstate_method: 0 #options REMD, MD or 0 (0 = no endstate sim; use the provided _298K.nc as the endstate trajectories)

  intermediate_states_arguments:
    mdin_intermediate_file: metro_inputs/four_fento_time_step_mdin_template.mdin # 4 fs, 10 ns intermediate windows
    igb_solvent: 2 #igb [1,2,3,7,8]
    exponent_conformational_forces: [-8.0, -2.0, 4.0] # list exponent values 2**p
    exponent_orientational_forces: [-4.0, 2.0, 8.0] # list exponent values 2**p
    restraint_type: 2 # choices: [ 1: CoM-CoM, 2: CoM-Heavy_Atom, 3: Heavy_Atom-Heavy_Atom, must be 1, 2 or 3 ]
    charges_lambda_window: [0.0, 0.5, 1.0]
    temperature: 298  # match the MD (mdin temp0=298) and the 298K endstate trajectories
    candidate_pool_step: 0.25
    max_adaptive_iterations: 10
    batch_insertion: True
    prune_after_convergence: True